name: setup-check

# Run the setup script on a fresh Ubuntu machine, as a cloud environment would,
# and check that the result builds the development.  Runs only when the setup
# changes, or by hand.
on:
  push:
    branches: [main]
    paths: [ci/setup-*.sh, ci/build.sh, .github/workflows/setup-check.yml]
  workflow_dispatch:

jobs:
  rocq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/run-annotated.sh "setup rocq" bash ci/setup-cloud.sh
      - run: bash ci/run-annotated.sh "build proofs" bash ci/build.sh
      - name: Re-run setup (should be quick)
        run: time bash ci/setup-cloud.sh
