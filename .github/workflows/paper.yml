name: paper

# Compile the paper and publish it, only when it can have changed.  The paper
# depends on theories/ as well: its code links carry line numbers.
on:
  push:
    branches: [main]
    paths: [tex/**, theories/**, .github/workflows/paper.yml]
  pull_request:
    paths: [tex/**, theories/**, .github/workflows/paper.yml]
  workflow_dispatch:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compile the paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: tex
          # .latexmkrc runs mechlinks.py, which needs Python.
          extra_system_packages: python3
      - name: Upload the PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: tex/main.pdf
      # On main, replace the single commit on the pdf branch with the new PDF,
      # so https://github.com/<owner>/<repo>/blob/pdf/paper.pdf is always current.
      - name: Publish the PDF to the pdf branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir out
          cp tex/main.pdf out/paper.pdf
          cd out
          git init -q -b pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper.pdf
          git commit -q -m "Paper built from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" pdf
